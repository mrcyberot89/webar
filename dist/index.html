<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><meta name="apple-mobile-web-app-capable" content="yes"><title>A-Frame: Image Targets Example</title><script crossorigin="anonymous" src="./external/scripts/8frame-1.5.0.min.js"></script><script src="https://cdn.jsdelivr.net/npm/@8thwall/engine-binary@1/dist/xr.js" async crossorigin="anonymous" data-preload-chunks="slam"></script><script src="https://cdn.jsdelivr.net/npm/@8thwall/landing-page@1/dist/landing-page.js" crossorigin="anonymous"></script><script src="https://cdn.jsdelivr.net/npm/@8thwall/xrextras@1/dist/xrextras.js" crossorigin="anonymous"></script></head><body><script src="bundle.js"></script><a-scene xrextras-gesture-detector landing-page xrextras-loading xrextras-runtime-error renderer="colorManagement:true" xrweb="disableWorldTracking: true"><a-assets><a-asset-item id="jelly-glb" src="assets/jellyfish-model.glb"></a-asset-item><img id="jelly-thumb" src="assets/video-target.jpg"><video id="jelly-video" autoplay muted crossorigin="anonymous" loop="true" src="assets/jellyfish-video.mp4"></video><video id="soekarno" preload="auto" autoplay loop="true" crossorigin="anonymous" src="assets/soekarno.mp4"></video><img id="thumb-lukisan" src="assets/soekarno.jpeg"><video id="video-lukisan" src="assets/tes-animasi.mp4" autoplay muted loop="true" crossorigin="anonymous"></video><img id="thumb-lukisan" src="assets/lukisan-target.jpeg"></a-assets><a-camera position="0 4 10" raycaster="objects: .cantap" cursor="fuse: false; rayOrigin: mouse;"></a-camera><a-light type="directional" intensity="0.5" position="1 1 1"></a-light><a-light type="ambient" intensity="1"></a-light><xrextras-named-image-target name="video-target"><a-entity xrextras-play-video="video: #jelly-video; thumb: #jelly-thumb; canstop: true" geometry="primitive: plane; height: 1; width: 0.79;"></a-entity></xrextras-named-image-target><xrextras-named-image-target name="model-target"><a-entity xrextras-one-finger-rotate gltf-model="#jelly-glb"></a-entity></xrextras-named-image-target><xrextras-named-image-target name="tes-animasi"><a-entity xrextras-play-video="video: #video-lukisan; thumb: #thumb-lukisan; canstop: true" geometry="primitive: plane; height: 1; width: 0.79;"></a-entity></xrextras-named-image-target><xrextras-named-image-target name="soekarno"><a-entity xrextras-play-video="video: #soekarno; thumb: #thumb-lukisan; canstop: true" geometry="primitive: plane; height: 1.3; width: 0.75;"></a-entity></xrextras-named-image-target></a-scene></body></html>
